<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Den-Watcher</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="mascot.svg" />
    <!-- For installing the page as an app; its service worker (sw.js) runs only over https. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181210" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Den-Watcher" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Keeps the browser's offer to install the page, which may come before the app has started.
      addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.installOffer = event;
      });
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
