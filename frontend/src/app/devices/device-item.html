@let values = summary();
<button
  type="button"
  [attr.aria-pressed]="selected()"
  [title]="compact() ? name() + ' · ' + status() : status()"
  (click)="picked.emit()"
>
  @if (compact()) {
    <span class="avatar" aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <circle class="track" cx="18" cy="18" r="16" />
        @if (values?.cpu !== undefined) {
          <circle
            class="usage"
            cx="18"
            cy="18"
            r="16"
            pathLength="100"
            [attr.stroke-dasharray]="values!.cpu + ' 100'"
          />
        }
      </svg>
      {{ initials() }}
      <app-status-dot [state]="state()" />
    </span>
    <span class="visually-hidden">
      {{ name() }}
      @if (state() !== 'reachable') {
        ({{ shortStatus() }})
      }
    </span>
    @if (alertLevel(); as level) {
      <app-alert-icon [level]="level" role="img" [attr.aria-label]="i18n.t('alerts.onCard')" />
    }
  } @else {
    <span class="title">
      <app-status-dot [state]="state()" />
      <span class="name">{{ name() }}</span>
      @if (alertLevel(); as level) {
        <app-alert-icon [level]="level" role="img" [attr.aria-label]="i18n.t('alerts.onCard')" />
      }
    </span>
    @if (state() !== 'reachable' || device().pairing) {
      <span class="detail">{{ status() }}</span>
    } @else if (values?.cpu !== undefined) {
      <span class="detail values">
        <span
          >{{ i18n.t('compare.cpu') }} {{ values!.cpu | number: '1.0-0' : i18n.language() }} %</span
        >
        <progress max="100" [value]="values!.cpu"></progress>
        <span>
          @if (values!.temperature; as t) {
            {{ t.celsius | number: '1.0-0' : i18n.language() }} °C
          }
        </span>
      </span>
    }
  }
</button>
