version: 2
# Every update gets a "Change" and an "Area" label (.github/labels.json).
updates:
  # Keep the actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, repo]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    labels: [dependencies, server]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    labels: [dependencies, ui]
    schedule:
      interval: weekly
    ignore:
      # Angular supports a fixed range of TypeScript versions; a new TypeScript
      # major comes in with the Angular upgrade that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "angular-eslint"

  - package-ecosystem: gradle
    directory: /android
    labels: [dependencies, tracking]
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    labels: [dependencies, install]
    schedule:
      interval: weekly
