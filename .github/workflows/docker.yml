name: Docker image

# Builds the image for arm64 (Raspberry Pi) and amd64 and publishes it to the GitHub
# Container Registry as ghcr.io/<owner>/den-watcher when a pull request is merged
# into main or a version tag (v1.2.3 or 1.2.3, a bugfix such as 1.2.3a, or a
# pre-release such as 1.2.3-alpha) is pushed.
# Pull requests only build it, in the CI workflow's "Docker image (arm64 and amd64)" job,
# which also starts the amd64 image with two add-on containers.
on:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3, a bugfix 1.2.3a or 1.2.3-alpha.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    # Docs-only changes don't change the image.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # Let every publishing run finish.
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish (arm64 and amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The version the program reports: 1.2.3 for a tag v1.2.3, otherwise the
      # branch and commit, such as main-1a2b3c4. A tag that is no release
      # version, such as v1.2, fails here, before anything is published.
      # latest says whether the tag is the newest release, so a bugfix of an
      # older line (a 2.3.4 after 3.0.0) does not move :latest back to a
      # version that may refuse the newer one's database.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The version of a release tag as four numbers, the letters of a
          # bugfix as the fourth, as in the demo workflow: 1.2.3 is 1 2 3 0,
          # 1.2.3a is 1 2 3 1. Fails on a tag that is no release version.
          version_key() {
            local letters i code bugfix=0
            [[ "${1#v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([a-z]*)$ ]] || return 1
            letters="${BASH_REMATCH[4]}"
            for ((i = 0; i < ${#letters}; i++)); do
              code="$(printf '%d' "'${letters:i:1}")"
              bugfix=$((bugfix * 26 + code - 96))
            done
            echo "$((10#${BASH_REMATCH[1]})) $((10#${BASH_REMATCH[2]})) $((10#${BASH_REMATCH[3]})) $bugfix"
          }
          # Whether the version key $1 is newer than $2.
          newer() {
            local -a a b
            local i
            read -ra a <<< "$1"
            read -ra b <<< "$2"
            for i in 0 1 2 3; do
              if ((a[i] != b[i])); then
                ((a[i] > b[i]))
                return
              fi
            done
            return 1
          }
          latest=false
          minor=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z]*|-[a-z]+(\.?[0-9]+)?)$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a release version; use v<major>.<minor>.<patch>, such as v1.2.3, with letters for bugfixes, such as 1.2.3a, or a word and maybe a number after a dash for a pre-release, such as 1.2.3-alpha or 1.2.3-rc1 (the v is optional)." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            # A pre-release, such as 1.2.3-alpha, never moves :latest.
            if key="$(version_key "$version")"; then
              if ! releases="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"; then
                echo "Could not list the releases, so it is unclear whether $GITHUB_REF_NAME is the newest and gets :latest; run the Docker image workflow again on the tag." >&2
                exit 1
              fi
              latest=true
              minor=true
              read -ra parts <<< "$key"
              while read -r release; do
                if release_key="$(version_key "$release")" && newer "$release_key" "$key"; then
                  if [[ "$latest" == true ]]; then
                    echo "$GITHUB_REF_NAME is older than the release $release, so :latest stays where it is."
                    latest=false
                  fi
                  # A late bugfix of an older patch, such as 1.2.3a after 1.2.4,
                  # leaves :1.2 on the newer one.
                  read -ra release_parts <<< "$release_key"
                  if [[ "$minor" == true && "${release_parts[0]} ${release_parts[1]}" == "${parts[0]} ${parts[1]}" ]]; then
                    echo "$GITHUB_REF_NAME is older than the release $release, so :${parts[0]}.${parts[1]} stays where it is."
                    minor=false
                  fi
                fi
              done <<< "$releases"
            fi
          else
            echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      # main publishes :main, a tag v1.2.3 publishes :1.2.3, :1.2 when it is the
      # newest release of 1.2, and :latest when it is the newest release,
      # and every published image also gets :sha-<commit>. A pre-release tag
      # such as 1.2.3-alpha publishes only :1.2.3-alpha (and :sha-<commit>).
      # A bugfix tag such as 1.2.3a is not semver, so the tags are matched by
      # pattern instead.
      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Independent of the repository's name. The old name, usage-control,
          # was published up to and including 3.0.0, the last version for Docker
          # installs from before the rename.
          images: |
            ghcr.io/${{ github.repository_owner }}/den-watcher
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=match,pattern=^v?(\d+\.\d+\.\d+(?:[a-z]*|-[a-z]+(?:\.?\d+)?))$,group=1
            type=match,pattern=^v?(\d+\.\d+)\.\d+[a-z]*$,group=1,enable=${{ steps.version.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=sha,format=short

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The final stage only copies the binary, so arm64 needs no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Names the published images in the notes of the tag's GitHub release, so the
  # release page says how to run it with Docker next to the Windows installers.
  release-notes:
    name: Name the images in the release notes
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the images to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          LATEST: ${{ needs.image.outputs.latest }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          image="ghcr.io/${OWNER,,}/den-watcher"
          # The Windows workflow may create the release at the same time.
          if ! gh release view "$tag" > /dev/null 2>&1; then
            # A pre-release tag, such as 1.2.3-alpha, makes a pre-release.
            prerelease=()
            if [[ "$tag" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$tag" --verify-tag --generate-notes "${prerelease[@]}" || gh release view "$tag" > /dev/null
          fi
          also=" (also \`:latest\`)"
          if [[ "$LATEST" != true ]]; then
            # A pre-release, or a bugfix of an older line, does not move :latest.
            also=""
          fi
          notes="$(gh release view "$tag" --json body --jq .body)"
          marker="<!-- docker-images -->"
          if [[ "$notes" == *"$marker"* ]]; then
            echo "The release notes already name the images."
            exit 0
          fi
          cat > notes.md <<NOTES
          $notes

          $marker
          ## Docker (Linux, Raspberry Pi)

          Images for arm64 and amd64: \`$image:$version\`$also.

          Update with \`docker compose pull && docker compose up -d\` in the folder with \`compose.yaml\`.

          A \`compose.yaml\` from before the rename to den-watcher still pulls the image by its old name, usage-control, which stopped at 3.0.0: run \`git pull\` and then \`docker compose up -d --remove-orphans\` in its folder.
          NOTES
          gh release edit "$tag" --notes-file notes.md
