name: Linux archives

# Builds the archives for installing without Docker on Linux
# (den-watcher-<version>-linux-amd64.tar.gz and -arm64.tar.gz: the program,
# a systemd service, the add-ons with their services, and install.sh) and checks on a machine with systemd that
# the amd64 one installs, keeps its settings across an update and uninstalls
# (linux/check-install.sh). Pull requests and main keep the archives as a
# workflow artifact; a version tag (v1.2.3 or 1.2.3, or a pre-release such
# as 1.2.3-alpha) also attaches them to that GitHub release.
on:
  pull_request:
  push:
    branches:
      - main
    # A release tag, with or without the v: v1.2.3 or 1.2.3, or 1.2.3-alpha.
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main and tags finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archives:
    name: Linux archives (amd64 and arm64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag v1.2.3 builds version 1.2.3; anything else dev-<commit>, which
      # the update check leaves alone. A tag that is no release version, such
      # as v1.2, fails, as in the other release workflows.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z]*|-[a-z]+(\.?[0-9]+)?)$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a release version; use v<major>.<minor>.<patch>, such as v1.2.3, with letters for bugfixes, such as 1.2.3a, or a word and maybe a number after a dash for a pre-release, such as 1.2.3-alpha or 1.2.3-rc1 (the v is optional)." >&2
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Writes the website into backend/internal/web/files/build, which the
      # program embeds.
      - name: Build the website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Embedded with the website and served at /go-licenses.txt.
      - name: Collect the licenses of the Go modules
        working-directory: backend
        run: go run ./cmd/licenses

      - name: Build the archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            folder="den-watcher-$VERSION-linux-$arch"
            mkdir -p "dist/$folder"
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/Programmer-Den/den-watcher/backend/internal/version.Version=$VERSION" \
              -o "../dist/$folder/den-watcher" ./cmd/den-watcher)
            # Every add-on, each with its service file in linux/.
            for addon in linux/den-watcher-*.service; do
              name="$(basename "$addon" .service)"
              (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" \
                -o "../dist/$folder/$name" "./cmd/$name")
              cp "$addon" "dist/$folder/"
            done
            cp linux/install.sh linux/den-watcher.service linux/den-watcher.env.example "dist/$folder/"
            tar -czf "dist/$folder.tar.gz" -C dist "$folder"
          done
          ls -l dist/*.tar.gz

      # The runner has systemd, so the archive is installed for real, first
      # over 2.0.7a, the last release from before the rename to den-watcher,
      # which it has to take over.
      - name: Install, update and uninstall it
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 2.0.7a --repo "$GITHUB_REPOSITORY" --pattern 'usage-control-2.0.7a-linux-amd64.tar.gz' --dir old
          sudo linux/check-install.sh "dist/den-watcher-$VERSION-linux-amd64.tar.gz" "$VERSION" old/usage-control-2.0.7a-linux-amd64.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: den-watcher-${{ steps.version.outputs.version }}-linux
          path: dist/*.tar.gz
          retention-days: 14

  release:
    name: Attach the archives to the release
    if: github.ref_type == 'tag'
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: den-watcher-${{ needs.archives.outputs.version }}-linux
          path: dist

      # Creates the release for the tag if there is none yet (the other
      # release workflows may at the same time), then adds the archives.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A pre-release tag, such as 1.2.3-alpha, makes a pre-release.
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}" || gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
