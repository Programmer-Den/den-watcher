name: PR Links

on:
  pull_request:
    # "edited" re-runs the check when the title or description changes and
    # "synchronize" when commits are pushed, so removing the link turns it green
    # again.
    types: [opened, edited, reopened, synchronize]
  # A new or edited comment or review is checked at once. These runs do not
  # show as a check on the pull request, so they cannot block its merge; the
  # run of the pull request itself checks the comments too, at its next push
  # or edit.
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  github-links-only:
    # A comment on an issue that is not a pull request is not checked; skipping
    # the job still reports the check as passed.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title, description, commit messages and comments link only to GitHub
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The texts are read as data from the API; they never reach a shell. The
            // PR is fetched fresh, as a re-run of an older run would otherwise
            // check the title and description it started with.
            const pull_number = (context.payload.pull_request ?? context.payload.issue).number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const body = pr.body || '';
            // What GitHub turns into a link: a URL with a scheme, or one starting with www.
            const link = /\b(?:[a-z][a-z0-9+.-]*:\/\/|www\.)[^\s<>()[\]"'`]+/gi;
            const host = (url) => {
              try {
                return new URL(/^www\./i.test(url) ? `https://${url}` : url).hostname.toLowerCase();
              } catch {
                return '';
              }
            };
            // The owner's GitHub Pages site hosts the demo (the mock pages).
            const pages = `${context.repo.owner.toLowerCase()}.github.io`;
            const onGitHub = (h) =>
              h === 'github.com' || h.endsWith('.github.com') || h.endsWith('.githubusercontent.com') ||
              h === pages;

            // GitHub's pages about Copilot are AI links all the same (AGENTS.md, "No AI
            // Links"), as ci/check-no-ai-links.sh counts them in the files.
            const copilot = /^(?:[a-z][a-z0-9+.-]*:\/\/)?(?:www\.)?(?:copilot\.github\.com|github\.com\/(?:features\/)?copilot(?![a-z0-9-])|docs\.github\.com\/\S*copilot)/i;

            const linksOutside = (text, where) =>
              text.split(/\r?\n/).flatMap((line, i) =>
                [...line.matchAll(link)]
                  .map(m => m[0])
                  .filter(url => !onGitHub(host(url)) || copilot.test(url))
                  .map(url => `${where}, line ${i + 1}: ${url}`));

            const everyPage = (list, params) => github.paginate(list, { ...context.repo, ...params, per_page: 100 });
            const commits = await everyPage(github.rest.pulls.listCommits, { pull_number });
            // The comments, the reviews and the comments on lines of the diff.
            const comments = await everyPage(github.rest.issues.listComments, { issue_number: pull_number });
            const reviews = await everyPage(github.rest.pulls.listReviews, { pull_number });
            const reviewComments = await everyPage(github.rest.pulls.listReviewComments, { pull_number });
            // Dependabot's title, description and commit messages link to the
            // release notes of each dependency; the comments on its pull
            // requests are checked like any other.
            const dependabot = pr.user.login === 'dependabot[bot]';
            const hits = [
              ...(dependabot ? [] : linksOutside(pr.title, 'title')),
              ...(dependabot ? [] : linksOutside(body, 'description')),
              ...(dependabot ? [] : commits.flatMap(c => linksOutside(c.commit.message, `commit ${c.sha.slice(0, 7)}`))),
              ...comments.flatMap(c => linksOutside(c.body || '', `comment ${c.html_url}`)),
              ...reviews.flatMap(r => linksOutside(r.body || '', `review ${r.html_url}`)),
              ...reviewComments.flatMap(c => linksOutside(c.body || '', `review comment ${c.html_url}`))
            ];

            if (hits.length > 0) {
              core.setFailed(`PR links outside GitHub or to Copilot; edit the title, description or comment, or reword the commits and the check re-runs:\n${hits.join('\n')}`);
            } else {
              console.log(`PR title, description, ${commits.length} commit message(s), ${comments.length} comment(s), ${reviews.length} review(s) and ${reviewComments.length} review comment(s) link only to GitHub.`);
            }
