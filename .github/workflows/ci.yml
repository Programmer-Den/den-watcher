name: CI

# Pull requests always run this workflow: "Lint and secret check" is a required
# check on main, and the secret check covers docs too. Pushes to main skip changes
# that cannot break anything checked here.
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the commits of the pull request or push.
          fetch-depth: 0

      # The newest gitleaks release, checked against its published checksums.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo gitleaks/gitleaks --json tagName --jq .tagName)"
          file="gitleaks_${tag#v}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          gh release download "$tag" --repo gitleaks/gitleaks --pattern "$file" --pattern "gitleaks_${tag#v}_checksums.txt"
          grep " $file\$" "gitleaks_${tag#v}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Scans the commits of the pull request or push (all of them on a manual
      # run) with .gitleaks.toml and .gitleaksignore.
      - name: No settings, keys or passwords committed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$BASE..$HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] && range="$GITHUB_SHA" || range="$BEFORE..$GITHUB_SHA" ;;
            *) range='' ;;
          esac
          gitleaks git --no-banner --redact -v ${range:+--log-opts="$range"}

      - name: No links to AI sites
        run: bash ci/check-no-ai-links.sh

      - name: Every add-on has mock data in the demo
        run: bash ci/check-demo-covers-addons.sh

      # shellcheck ships with the hosted runner image.
      - name: Check shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck --color=never "${scripts[@]}"

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -no-color -oneline

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Run gofmt -w on these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

      # With the race detector, as the hub, the sampler and the phones run
      # side by side.
      - name: Test
        run: go test -race ./...

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # The release builds embed these notices; a new module without a
      # license file fails here instead of in a release.
      - name: Collect the licenses of the Go modules
        run: go run ./cmd/licenses -out "$RUNNER_TEMP/go-licenses.txt"

      # Only reports vulnerabilities in code the backend actually calls.
      - name: Check dependencies for known vulnerabilities
        run: go tool govulncheck ./...

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      # The demo on GitHub Pages, so a change that breaks it shows up before the merge.
      - run: npm run build:demo
      # Every view of the demo in a real browser (the runner's Chrome), which fails on any error
      # the page throws or logs.
      - run: npm run test:demo

  docker:
    name: Docker image (arm64 and amd64)
    # Merges to main build and publish the image in the Docker image workflow.
    # A dispatch runs it too, for the nightly vulnerability pull request,
    # which starts its checks by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds both architectures without pushing, to catch a broken image before merge.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The amd64 image again, from the build above's cache, loaded into the
      # runner's Docker for the check below.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/programmer-den/den-watcher:ci
          cache-from: type=gha

      # Starts den-watcher with two add-on containers as compose.yaml sets
      # them up, one as root without capabilities (power) and one as the
      # image's user (processes), and waits until den-watcher shows what
      # the processes add-on wrote to the shared add-on volume. Then it checks
      # that a volume whose history is named usage-control.db, as up to
      # 4.0.0, keeps it as den-watcher.db.
      - name: Start it with add-ons
        env:
          IMAGE_TAG: ci
          COMPOSE_PROFILES: power,processes
        run: |
          set -euo pipefail
          docker compose up -d --no-build --pull never
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9393/api/metrics 2> /dev/null | grep -q '"id":"processes-memory"'; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:9393/api/metrics | grep -q '"id":"processes-memory"'; then
            docker compose logs >&2
            echo "den-watcher does not show the processes add-on" >&2
            exit 1
          fi
          # A container that ends is restarted, so it has to have run
          # throughout.
          mapfile -t containers < <(docker compose ps -aq)
          restarts="$(docker inspect -f '{{.RestartCount}}' "${containers[@]}" | sort -u | tr '\n' ' ')"
          if [[ "$(docker compose ps --status running --services | sort | tr '\n' ' ')" != "den-watcher power processes " || "$restarts" != "0 " ]]; then
            docker compose ps -a >&2
            docker compose logs >&2
            echo "not every container is running" >&2
            exit 1
          fi
          # The command compose.yaml's health check runs.
          docker compose exec -T den-watcher /den-watcher healthcheck
          docker compose down -v
          # The image itself makes the old file, with the old name set.
          image=ghcr.io/programmer-den/den-watcher:ci
          docker run -d --name old-name -v rename-check:/data -e DATABASE_PATH=/data/usage-control.db "$image"
          has() { docker run --rm -v rename-check:/data alpine test -f "/data/$1"; }
          for _ in $(seq 1 30); do has usage-control.db && break; sleep 1; done
          docker rm -f old-name
          has usage-control.db || { echo "the image made no usage-control.db" >&2; exit 1; }
          docker run -d --name new-name -v rename-check:/data "$image"
          for _ in $(seq 1 30); do has den-watcher.db && break; sleep 1; done
          docker logs new-name >&2
          docker rm -f new-name
          has den-watcher.db || { echo "the image did not rename usage-control.db to den-watcher.db" >&2; exit 1; }
          if has usage-control.db; then echo "the image left usage-control.db" >&2; exit 1; fi
          docker volume rm rename-check
